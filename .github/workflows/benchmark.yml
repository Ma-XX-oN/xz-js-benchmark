name: XZ benchmark

on:
  workflow_dispatch:
  push:
    branches: [main, issue-16-zstd]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native tools
        run: sudo apt-get update && sudo apt-get install -y xz-utils zstd autoconf automake libtool gettext autopoint
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984
        with:
          version: 3.1.51
          no-cache: true
      - name: Checkout XZ source
        uses: actions/checkout@v4
        with:
          repository: tukaani-project/xz
          ref: 3b1efb04d17c3a9ef7f473d73af13f1531428ffe
          path: .xz-src
      - name: Checkout Zstd source
        uses: actions/checkout@v4
        with:
          repository: facebook/zstd
          ref: 01b7154f1172432f8abe9b3bb9909e14a1176b7d
          path: .zstd-src
      - name: Checkout Brotli source
        uses: actions/checkout@v4
        with:
          repository: google/brotli
          ref: d5d3f45973da91c386dd7e1086b13facecfb4087
          path: .brotli-src
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test
      - name: Compiler optimization preflight
        if: github.ref == 'refs/heads/issue-16-zstd'
        run: |
          mkdir -p optimization-preflight
          for opt in O2 O3 Os Oz; do
            BUILD_TAG="$opt" bash scripts/build-wasm-codecs.sh "-$opt"
            BENCH_CORPUS_BYTES=4194304 BENCH_REPETITIONS=3 npm run benchmark:browser
            cp browser-benchmark-results/results.json "optimization-preflight/$opt.json"
          done
      - name: Upload optimization preflight
        if: github.ref == 'refs/heads/issue-16-zstd'
        uses: actions/upload-artifact@v4
        with:
          name: wasm-optimization-preflight
          path: optimization-preflight/
      - name: Build selected WASM codecs
        if: github.ref == 'refs/heads/main'
        run: BUILD_TAG=selected ./scripts/build-wasm-codecs.sh -O3
      - name: Benchmark
        if: github.ref == 'refs/heads/main'
        run: npm run benchmark
      - name: Browser comparison
        if: github.ref == 'refs/heads/main'
        run: npm run benchmark:browser
      - name: Generate browser report
        if: github.ref == 'refs/heads/main'
        run: npm run report:browser
      - name: Upload browser comparison
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: browser-compression-benchmark-results
          path: browser-benchmark-results/
      - name: Upload results
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: xz-js-benchmark-results
          path: benchmark-results/
