name: XZ benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native xz
        run: sudo apt-get update && sudo apt-get install -y xz-utils
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test
      - name: Benchmark
        if: github.ref == 'refs/heads/main'
        run: npm run benchmark
      - name: Browser-native comparison
        run: npm run benchmark:browser
      - name: Generate browser report
        run: npm run report:browser
      - name: Upload browser comparison
        uses: actions/upload-artifact@v4
        with:
          name: browser-compression-benchmark-results
          path: browser-benchmark-results/
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: xz-js-benchmark-results
          path: benchmark-results/
