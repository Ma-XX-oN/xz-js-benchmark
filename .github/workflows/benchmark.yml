name: XZ benchmark

on:
  workflow_dispatch:
  push:
    branches: [main, issue-9-xz-presets]

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native xz
        run: sudo apt-get update && sudo apt-get install -y xz-utils
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984
        with:
          version: 3.1.51
          no-cache: true
      - name: Checkout Brotli source
        uses: actions/checkout@v4
        with:
          repository: google/brotli
          ref: d5d3f45973da91c386dd7e1086b13facecfb4087
          path: .brotli-src
      - name: Build Brotli WASM
        run: |
          mkdir -p wasm
          emcc \
            src/brotli-wasm-wrapper.c \
            .brotli-src/c/common/*.c \
            .brotli-src/c/enc/*.c \
            .brotli-src/c/dec/*.c \
            -I.brotli-src/c/include \
            -O3 \
            -s STANDALONE_WASM=1 \
            -s ALLOW_MEMORY_GROWTH=1 \
            -Wl,--no-entry \
            -Wl,--export=br_max_compressed_size \
            -Wl,--export=br_compress \
            -Wl,--export=br_decompress \
            -Wl,--export=br_malloc \
            -Wl,--export=br_free \
            -o wasm/brotli.wasm
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test
      - name: Benchmark
        if: github.ref == 'refs/heads/main'
        run: npm run benchmark
      - name: Browser-native comparison
        run: npm run benchmark:browser
      - name: Generate browser report
        run: npm run report:browser
      - name: Publish browser comparison
        if: github.ref == 'refs/heads/issue-9-xz-presets'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add browser-benchmark-results/
          if ! git diff --cached --quiet; then
            git commit -m "Publish regenerated benchmark charts [skip ci]"
            git push
          fi
      - name: Upload browser comparison
        uses: actions/upload-artifact@v4
        with:
          name: browser-compression-benchmark-results
          path: browser-benchmark-results/
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: xz-js-benchmark-results
          path: benchmark-results/
