name: Modern liblzma WASM

on:
  workflow_dispatch:
  push:
    branches: [issue-3-upstream-liblzma-wasm]
  pull_request:
    branches: [main]

jobs:
  modern-liblzma-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install common tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils cmake ninja-build
          cargo install wasm-pack --locked
          npm install
      - name: Install Emscripten 6.0.10
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git .emsdk
          ./.emsdk/emsdk install 6.0.10
          ./.emsdk/emsdk activate 6.0.10
          source ./.emsdk/emsdk_env.sh
          emcc --version
      - name: Build Rust reference
        run: wasm-pack build prototype/direct-xz --target web --release --out-dir pkg-web
      - name: Fetch pinned upstream XZ
        run: |
          git clone https://github.com/tukaani-project/xz.git upstream-xz
          git -C upstream-xz checkout 3b1efb04d17c3a9ef7f473d73af13f1531428ffe
      - name: Build scalar and SIMD liblzma
        shell: bash
        run: |
          source ./.emsdk/emsdk_env.sh
          exports='["_dc_xz_encoder_new","_dc_xz_encoder_write","_dc_xz_encoder_finish","_dc_xz_encoder_free","_dc_xz_decode","_dc_xz_buffer_free","_malloc","_free"]'
          build_variant() {
            local name="$1"
            local flags="$2"
            local build="upstream-xz/build-$name"
            local out="prototype/liblzma-wasm/$name"
            emcmake cmake -S upstream-xz -B "$build" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_BYTE_ORDER=LITTLE_ENDIAN \
              -DBUILD_SHARED_LIBS=OFF \
              -DXZ_NLS=OFF \
              -DXZ_TOOL_XZ=OFF \
              -DXZ_TOOL_XZDEC=OFF \
              -DXZ_TOOL_LZMADEC=OFF \
              -DXZ_TOOL_LZMAINFO=OFF \
              -DXZ_TOOL_SCRIPTS=OFF \
              -DXZ_DOC=OFF \
              -DXZ_ENCODERS='lzma1;lzma2' \
              -DXZ_DECODERS='lzma1;lzma2' \
              -DXZ_CHECKS=crc64 \
              -DXZ_MATCH_FINDERS=bt4 \
              -DCMAKE_C_FLAGS_RELEASE="-O3 -flto $flags"
            cmake --build "$build" --target liblzma
            mkdir -p "$out"
            emcc prototype/liblzma-wasm/wrapper.c "$build/liblzma.a" \
              -Iupstream-xz/src/liblzma/api \
              -O3 -flto $flags \
              -sMODULARIZE=1 \
              -sENVIRONMENT=node \
              -sALLOW_MEMORY_GROWTH=1 \
              -sFILESYSTEM=0 \
              -sEXPORTED_FUNCTIONS="$exports" \
              -sEXPORTED_RUNTIME_METHODS='["HEAPU8","HEAPU32"]' \
              -o "$out/liblzma.cjs"
          }
          build_variant scalar ''
          build_variant simd128 '-msimd128'
          mkdir -p prototype/liblzma-wasm/browser
          emcc prototype/liblzma-wasm/wrapper.c upstream-xz/build-scalar/liblzma.a \
            -Iupstream-xz/src/liblzma/api \
            -O3 -flto \
            -sMODULARIZE=1 \
            -sEXPORT_ES6=1 \
            -sENVIRONMENT=web \
            -sWASM_ASYNC_COMPILATION=0 \
            -sALLOW_MEMORY_GROWTH=1 \
            -sFILESYSTEM=0 \
            -sEXPORTED_FUNCTIONS="$exports" \
            -sEXPORTED_RUNTIME_METHODS='["HEAPU8","HEAPU32"]' \
            -o prototype/liblzma-wasm/browser/liblzma.mjs
      - name: Native compatibility and decoder test
        run: |
          cp prototype/liblzma-wasm/scalar/liblzma.cjs prototype/liblzma-wasm/liblzma.cjs
          cp prototype/liblzma-wasm/scalar/liblzma.wasm prototype/liblzma-wasm/liblzma.wasm
          node --test test/liblzma-wasm.test.mjs
      - name: Compare scalar, SIMD, Rust, and native
        run: node src/liblzma-modern-compare.mjs
      - name: Measure payloads and preserve browser build
        shell: bash
        run: |
          source ./.emsdk/emsdk_env.sh
          mkdir -p benchmark-results
          for variant in scalar simd128; do
            gzip -9 -c "prototype/liblzma-wasm/$variant/liblzma.wasm" > "benchmark-results/$variant.wasm.gz"
            gzip -9 -c "prototype/liblzma-wasm/$variant/liblzma.cjs" > "benchmark-results/$variant.cjs.gz"
          done
          cp prototype/liblzma-wasm/browser/liblzma.mjs benchmark-results/browser-liblzma.mjs
          cp prototype/liblzma-wasm/browser/liblzma.wasm benchmark-results/browser-liblzma.wasm
          gzip -9 -c prototype/liblzma-wasm/browser/liblzma.wasm > benchmark-results/browser-liblzma.wasm.gz
          gzip -9 -c prototype/liblzma-wasm/browser/liblzma.mjs > benchmark-results/browser-liblzma.mjs.gz
          gzip -9 -c prototype/direct-xz/pkg-web/direct_xz_wasm_bg.wasm > benchmark-results/rust.wasm.gz
          gzip -9 -c prototype/direct-xz/pkg-web/direct_xz_wasm.js > benchmark-results/rust.js.gz
          {
            echo '# Same-runner payload comparison'
            echo
            emcc --version | head -n 1
            echo
            echo '| Codec | WASM raw | WASM gzip | JS raw | JS gzip | Total gzip |'
            echo '|---|---:|---:|---:|---:|---:|'
            for variant in scalar simd128; do
              wr=$(stat -c%s "prototype/liblzma-wasm/$variant/liblzma.wasm")
              wg=$(stat -c%s "benchmark-results/$variant.wasm.gz")
              jr=$(stat -c%s "prototype/liblzma-wasm/$variant/liblzma.cjs")
              jg=$(stat -c%s "benchmark-results/$variant.cjs.gz")
              echo "| liblzma $variant | $wr | $wg | $jr | $jg | $((wg+jg)) |"
            done
            wr=$(stat -c%s prototype/direct-xz/pkg-web/direct_xz_wasm_bg.wasm)
            wg=$(stat -c%s benchmark-results/rust.wasm.gz)
            jr=$(stat -c%s prototype/direct-xz/pkg-web/direct_xz_wasm.js)
            jg=$(stat -c%s benchmark-results/rust.js.gz)
            echo "| lzma-rust2 0.16.2 | $wr | $wg | $jr | $jg | $((wg+jg)) |"
          } | tee benchmark-results/modern-same-runner-payload.md
      - uses: actions/upload-artifact@v4
        with:
          name: modern-liblzma-same-runner
          path: benchmark-results/
