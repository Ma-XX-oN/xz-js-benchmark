name: Modern liblzma WASM

on:
  workflow_dispatch:
  push:
    branches: [issue-3-upstream-liblzma-wasm]
  pull_request:
    branches: [main]

jobs:
  modern-liblzma-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: scalar
            simd_flags: ''
          - variant: simd128
            simd_flags: '-msimd128'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install common tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils cmake ninja-build
          cargo install wasm-pack --locked
          npm install
      - name: Install Emscripten 6.0.10
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git .emsdk
          ./.emsdk/emsdk install 6.0.10
          ./.emsdk/emsdk activate 6.0.10
          source ./.emsdk/emsdk_env.sh
          emcc --version
          emcmake --version
      - name: Build Rust reference
        run: wasm-pack build prototype/direct-xz --target web --release --out-dir pkg-web
      - name: Fetch pinned upstream XZ
        run: |
          git clone https://github.com/tukaani-project/xz.git upstream-xz
          git -C upstream-xz checkout 3b1efb04d17c3a9ef7f473d73af13f1531428ffe
      - name: Build upstream liblzma (${{ matrix.variant }})
        shell: bash
        run: |
          source ./.emsdk/emsdk_env.sh
          FLAGS='${{ matrix.simd_flags }}'
          emcmake cmake -S upstream-xz -B upstream-xz/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_BYTE_ORDER=LITTLE_ENDIAN \
            -DBUILD_SHARED_LIBS=OFF \
            -DXZ_NLS=OFF \
            -DXZ_TOOL_XZ=OFF \
            -DXZ_TOOL_XZDEC=OFF \
            -DXZ_TOOL_LZMADEC=OFF \
            -DXZ_TOOL_LZMAINFO=OFF \
            -DXZ_TOOL_SCRIPTS=OFF \
            -DXZ_DOC=OFF \
            -DXZ_ENCODERS='lzma1;lzma2' \
            -DXZ_DECODERS='lzma1;lzma2' \
            -DXZ_CHECKS=crc64 \
            -DXZ_MATCH_FINDERS=bt4 \
            -DCMAKE_C_FLAGS_RELEASE="-O3 -flto $FLAGS"
          cmake --build upstream-xz/build --target liblzma
          mkdir -p prototype/liblzma-wasm
          emcc prototype/liblzma-wasm/wrapper.c upstream-xz/build/liblzma.a \
            -Iupstream-xz/src/liblzma/api \
            -O3 -flto $FLAGS \
            -sMODULARIZE=1 \
            -sENVIRONMENT=node \
            -sALLOW_MEMORY_GROWTH=1 \
            -sFILESYSTEM=0 \
            -sEXPORTED_FUNCTIONS='["_dc_xz_encoder_new","_dc_xz_encoder_write","_dc_xz_encoder_finish","_dc_xz_encoder_free","_malloc","_free"]' \
            -sEXPORTED_RUNTIME_METHODS='["HEAPU8","HEAPU32"]' \
            -o prototype/liblzma-wasm/liblzma.cjs
      - name: Native compatibility test
        run: node --test test/liblzma-wasm.test.mjs
      - name: Diagnose speed gap
        run: node src/liblzma-speed-diagnosis.mjs
      - name: Measure payload
        shell: bash
        run: |
          mkdir -p benchmark-results
          gzip -9 -c prototype/liblzma-wasm/liblzma.wasm > benchmark-results/liblzma.wasm.gz
          gzip -9 -c prototype/liblzma-wasm/liblzma.cjs > benchmark-results/liblzma.cjs.gz
          {
            echo '# Modern Emscripten liblzma payload'
            echo
            emcc --version | head -n 1
            echo "variant=${{ matrix.variant }}"
            echo "wasm_raw=$(stat -c%s prototype/liblzma-wasm/liblzma.wasm)"
            echo "wasm_gzip=$(stat -c%s benchmark-results/liblzma.wasm.gz)"
            echo "js_raw=$(stat -c%s prototype/liblzma-wasm/liblzma.cjs)"
            echo "js_gzip=$(stat -c%s benchmark-results/liblzma.cjs.gz)"
          } | tee benchmark-results/modern-${{ matrix.variant }}-payload.txt
      - uses: actions/upload-artifact@v4
        with:
          name: modern-liblzma-${{ matrix.variant }}
          path: benchmark-results/
