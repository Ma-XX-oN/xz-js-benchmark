<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"><rect width="100%" height="100%" fill="white"/><text x="20" y="30" font-size="20" font-weight="bold">JSONL compression throughput (MiB/s; higher is better)</text><g font-size="14"><text x="180" y="75" text-anchor="end">gzip</text><rect x="190" y="58" width="44" height="22" fill="#777"/><text x="244" y="75">245.78</text><text x="180" y="120" text-anchor="end">Brotli/WASM q1</text><rect x="190" y="103" width="600" height="22" fill="#777"/><text x="800" y="120">3333.33</text><text x="180" y="165" text-anchor="end">Brotli/WASM q4</text><rect x="190" y="148" width="41" height="22" fill="#777"/><text x="241" y="165">228.73</text><text x="180" y="210" text-anchor="end">Brotli/WASM q6</text><rect x="190" y="193" width="36" height="22" fill="#777"/><text x="236" y="210">202.28</text><text x="180" y="255" text-anchor="end">Brotli/WASM q9</text><rect x="190" y="238" width="24" height="22" fill="#777"/><text x="224" y="255">132.62</text><text x="180" y="300" text-anchor="end">Brotli/WASM q11</text><rect x="190" y="283" width="1" height="22" fill="#777"/><text x="201" y="300">2.02</text><text x="180" y="345" text-anchor="end">XZ/WASM preset 6</text><rect x="190" y="328" width="2" height="22" fill="#777"/><text x="202" y="345">12.26</text></g><text x="20" y="405" font-size="14">Brotli q6 compresses 16.50× faster than XZ while producing a smaller archive.</text><text x="20" y="435" font-size="13">Source: workflow run 36513813896; median of 3 measured runs after 1 warm-up.</text></svg>